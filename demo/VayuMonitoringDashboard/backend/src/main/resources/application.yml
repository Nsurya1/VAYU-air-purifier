server:
  port: 8080

spring:
  application:
    name: vayu-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:vayu_monitoring}
    username: ${POSTGRES_USER:vayu_admin}
    password: ${POSTGRES_PASSWORD:vayu_dev_secret_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50

# SOCHI VAYU Security & MQTT Configuration
vayu:
  security:
    jwt:
      # Minimum 256-bit secret key for HMAC-SHA256
      secret: ${JWT_SECRET:sochi-vayu-air-purifier-fleet-monitoring-jwt-secret-key-2026-minimum-256-bits}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  mqtt:
    broker-url: ${MQTT_BROKER_URL:tcp://mosquitto:1883}
    client-id: ${MQTT_CLIENT_ID:vayu_backend_gateway}
    username: ${MQTT_BACKEND_USERNAME:vayu_backend}
    password: ${MQTT_BACKEND_PASSWORD:vayu_backend_pass_2026}
    topics:
      telemetry: "vayu/+/telemetry"
      status: "vayu/+/status"
      cmd-ack: "vayu/+/cmd/ack"
    qos: 1
    connection-timeout: 10
    keep-alive: 30
    clean-session: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
