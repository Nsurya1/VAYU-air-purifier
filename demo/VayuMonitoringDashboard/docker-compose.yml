# ==============================================================================
# SOCHI VAYU - Local-First Fleet Monitoring Stack
# Phase 1: Local Development Infrastructure (Mosquitto MQTT + PostgreSQL 16)
# ==============================================================================

networks:
  vayu-net:
    driver: bridge

volumes:
  mosquitto-data:
    name: vayu-mosquitto-data
  mosquitto-log:
    name: vayu-mosquitto-log
  postgres-data:
    name: vayu-postgres-data

services:
  # ----------------------------------------------------------------------------
  # 1. Eclipse Mosquitto: High-throughput local MQTT Broker
  # ----------------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: vayu-mosquitto
    restart: unless-stopped
    ports:
      # Strictly bound to 127.0.0.1 to prevent external exposure
      - "${HOST_BIND_IP:-127.0.0.1}:${MQTT_TCP_PORT:-1883}:1883"
      - "${HOST_BIND_IP:-127.0.0.1}:${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - ./mosquitto/config/passwordfile:/mosquitto/config/passwordfile
      - ./mosquitto/config/aclfile:/mosquitto/config/aclfile
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/broker/version' -u vayu_backend -P vayu_backend_pass_2026 -C 1 -i healthcheck -W 3 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - vayu-net

  # ----------------------------------------------------------------------------
  # 2. PostgreSQL 16: Telemetry History, Device Inventory & Audit Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vayu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vayu_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-vayu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayu_dev_secret_2026}
    ports:
      # Strictly bound to 127.0.0.1:5434 to avoid collision with existing native Postgres on 5432/5433
      - "${HOST_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vayu_admin} -d ${POSTGRES_DB:-vayu_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vayu-net

  # ----------------------------------------------------------------------------
  # 3. Spring Boot 3 Backend: Ingestion, Validation, REST APIs
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vayu-backend
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1:8081 to avoid collision with native Apache on 8080
      - "${HOST_BIND_IP:-127.0.0.1}:${BACKEND_PORT:-8081}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-vayu_monitoring}
      - POSTGRES_USER=${POSTGRES_USER:-vayu_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vayu_dev_secret_2026}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - MQTT_CLIENT_ID=vayu_backend_gateway
      - MQTT_BACKEND_USERNAME=${MQTT_BACKEND_USERNAME:-vayu_backend}
      - MQTT_BACKEND_PASSWORD=${MQTT_BACKEND_PASSWORD:-vayu_backend_pass_2026}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - vayu-net

  # ----------------------------------------------------------------------------
  # 4. React + TypeScript Dashboard (Web & TV Kiosk)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vayu-frontend
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1:3000 to prevent external public exposure
      - "${HOST_BIND_IP:-127.0.0.1}:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - vayu-net

  # ----------------------------------------------------------------------------
  # 3. Fleet Simulator: 30-Device Multi-Condition Fleet Generator
  # ----------------------------------------------------------------------------
  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    container_name: vayu-simulator
    restart: unless-stopped
    profiles:
      - simulator
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - mosquitto
    networks:
      - vayu-net
