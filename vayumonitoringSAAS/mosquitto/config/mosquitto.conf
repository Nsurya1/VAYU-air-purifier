# =======================================================
# SOCHI VAYU - Eclipse Mosquitto MQTT Configuration
# =======================================================

listener 1883 0.0.0.0

# Security: Disable anonymous access, require hashed credentials
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acls

# Transient in-memory operation (no persistent database or message queue spooling to disk)
persistence false

# Logging & Diagnostics
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
